aid: countertack
name: CounterTack
description: 'CounterTack, Inc. was a Waltham, Massachusetts endpoint detection and
  response (EDR) vendor whose Sentinel and Endpoint Threat Platform products applied
  behavioral analysis, memory forensics and machine learning to detect zero-days, rootkits
  and advanced persistent threats. In June 2018 CounterTack acquired its channel partner
  GoSecure, a managed detection and response (MDR) provider, and in March 2019 rebranded
  the combined company as "GoSecure powered by CounterTack"; the CounterTack name has
  since been retired in favour of GoSecure, which today markets a managed extended detection
  and response (MXDR) service and the GoSecure Titan platform covering EDR, IDR, NGAV,
  SIEM and professional services. The CounterTack surface is therefore historical: countertack.com
  still resolves to GoSecure infrastructure but serves no valid certificate, and the
  living platform is customer-only behind a Keycloak single sign-on at titan.gosecure.net.'
