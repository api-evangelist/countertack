apis:
- name: GoSecure Titan Platform API
  description: 'A customer-only HTTP API host operated by GoSecure (formerly CounterTack)
    behind the GoSecure Titan platform. The host answers HTTP 401 on every path probed
    — including /robots.txt and every /.well-known/ path — so no anonymous discovery,
    OpenAPI document, or reference documentation is reachable. Its identity layer is
    public: the Titan single sign-on is a Keycloak deployment at login.gosecure.net
    whose OpenID Connect discovery document for the gosec-titan realm is served anonymously
    and is captured in this repository. No public developer portal, API reference, SDK,
    pricing page, or rate-limit documentation could be found for this API.'
  humanURL: https://www.gosecure.ai/services/titan-platform
  baseURL: https://api.gosecure.net
  tags:
